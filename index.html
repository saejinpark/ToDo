<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Daylist 할 일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one app, four Apple idioms chosen by container width + pointer.
   watch ≤260pt: black, card rows, page dots · phone <768pt: tab bar · pad ≥768pt touch: sidebar + column · mac ≥1000pt pointer: source list + toolbar + inspector.
   A device bar (≥900px viewports) renders the app inside a Watch / iPhone / iPad / Mac frame for review. */
:root {
  --l-bg: #F2F2F7; --l-cell: #FFFFFF; --l-cell2: #F2F2F7; --l-label: #000000; --l-label2: rgba(60,60,67,.6); --l-label3: rgba(60,60,67,.3);
  --l-sep: rgba(60,60,67,.29); --l-fill: rgba(120,120,128,.2); --l-fill3: rgba(118,118,128,.12); --l-seg: #FFFFFF; --l-material: rgba(249,249,249,.84);
  --l-scrim: rgba(0,0,0,.2); --l-ring: rgba(120,120,128,.16); --l-stage: #DADAE0; --l-toast: rgba(30,30,32,.92);
  --l-blue: #007AFF; --l-red: #FF3B30; --l-orange: #FF9500; --l-yellow: #FFCC00; --l-green: #34C759; --l-indigo: #5856D6; --l-gray: #8E8E93;
  --d-bg: #000000; --d-cell: #1C1C1E; --d-cell2: #2C2C2E; --d-label: #FFFFFF; --d-label2: rgba(235,235,245,.6); --d-label3: rgba(235,235,245,.3);
  --d-sep: rgba(84,84,88,.6); --d-fill: rgba(120,120,128,.36); --d-fill3: rgba(118,118,128,.24); --d-seg: #636366; --d-material: rgba(29,29,31,.8);
  --d-scrim: rgba(0,0,0,.5); --d-ring: rgba(120,120,128,.3); --d-stage: #151517; --d-toast: rgba(58,58,60,.95);
  --d-blue: #0A84FF; --d-red: #FF453A; --d-orange: #FF9F0A; --d-yellow: #FFD60A; --d-green: #30D158; --d-indigo: #5E5CE6; --d-gray: #98989D;

  --bg: var(--l-bg); --cell: var(--l-cell); --cell2: var(--l-cell2); --label: var(--l-label); --label2: var(--l-label2); --label3: var(--l-label3);
  --sep: var(--l-sep); --fill: var(--l-fill); --fill3: var(--l-fill3); --seg-on: var(--l-seg); --material: var(--l-material); --scrim: var(--l-scrim);
  --ring-track: var(--l-ring); --stage: var(--l-stage); --toast: var(--l-toast); --toast-fg: #FFFFFF; --knob: #FFFFFF;
  --c-blue: var(--l-blue); --c-red: var(--l-red); --c-orange: var(--l-orange); --c-yellow: var(--l-yellow); --c-green: var(--l-green); --c-indigo: var(--l-indigo); --c-gray: var(--l-gray);
  --am: var(--c-orange); --pm: var(--c-blue); --eve: var(--c-indigo); --any: var(--c-gray);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --r: 10px; --ease: cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: var(--d-bg); --cell: var(--d-cell); --cell2: var(--d-cell2); --label: var(--d-label); --label2: var(--d-label2); --label3: var(--d-label3);
  --sep: var(--d-sep); --fill: var(--d-fill); --fill3: var(--d-fill3); --seg-on: var(--d-seg); --material: var(--d-material); --scrim: var(--d-scrim);
  --ring-track: var(--d-ring); --stage: var(--d-stage); --toast: var(--d-toast);
  --c-blue: var(--d-blue); --c-red: var(--d-red); --c-orange: var(--d-orange); --c-yellow: var(--d-yellow); --c-green: var(--d-green); --c-indigo: var(--d-indigo); --c-gray: var(--d-gray);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: var(--d-bg); --cell: var(--d-cell); --cell2: var(--d-cell2); --label: var(--d-label); --label2: var(--d-label2); --label3: var(--d-label3);
  --sep: var(--d-sep); --fill: var(--d-fill); --fill3: var(--d-fill3); --seg-on: var(--d-seg); --material: var(--d-material); --scrim: var(--d-scrim);
  --ring-track: var(--d-ring); --stage: var(--d-stage); --toast: var(--d-toast);
  --c-blue: var(--d-blue); --c-red: var(--d-red); --c-orange: var(--d-orange); --c-yellow: var(--d-yellow); --c-green: var(--d-green); --c-indigo: var(--d-indigo); --c-gray: var(--d-gray);
  color-scheme: dark;
}
/* watchOS is always dark */
.app[data-idiom="watch"] {
  --bg: var(--d-bg); --cell: var(--d-cell); --cell2: var(--d-cell2); --label: var(--d-label); --label2: var(--d-label2); --label3: var(--d-label3);
  --sep: var(--d-sep); --fill: var(--d-fill); --fill3: var(--d-fill3); --seg-on: var(--d-seg); --material: var(--d-material); --scrim: rgba(0,0,0,.7);
  --ring-track: var(--d-ring); --toast: var(--d-toast);
  --c-blue: var(--d-blue); --c-red: var(--d-red); --c-orange: var(--d-orange); --c-yellow: var(--d-yellow); --c-green: var(--d-green); --c-indigo: var(--d-indigo); --c-gray: var(--d-gray);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--label);
  font: 17px/22px var(--font); letter-spacing: -0.41px;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow: hidden; -webkit-user-select: none; user-select: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--c-blue) 60%, transparent); outline-offset: 2px; border-radius: 8px; }
svg { display: block; flex: none; }
h1, h2, h3, p { margin: 0; }

/* ---------- Stage + device frames ---------- */
.stage { height: 100%; display: grid; place-items: center; background: var(--bg); }
.stage.preview { background: var(--stage); }
.frame { position: relative; width: 100%; height: 100%; }
.stage.preview .frame {
  width: var(--fw); height: var(--fh); transform: scale(var(--fs)); transform-origin: center; border-radius: var(--fr);
  box-shadow: 0 0 0 var(--bezel) #0E0E10, 0 0 0 calc(var(--bezel) + 1px) #3A3A3E, 0 40px 90px rgba(0,0,0,.4);
}
.stage.preview .frame.mac { box-shadow: 0 0 0 .5px rgba(0,0,0,.35), 0 30px 80px rgba(0,0,0,.35); }
.stage.preview .app { border-radius: var(--fr); overflow: hidden; }
.frame::before, .frame::after { content: none; position: absolute; z-index: 60; pointer-events: none; }
.frame.phone::before { content: ""; top: 11px; left: 50%; width: 122px; height: 36px; margin-left: -61px; background: #000; border-radius: 20px; }
.frame.phone::after, .frame.pad::after { content: ""; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--label); opacity: .9; }
.frame.pad::after { width: 280px; margin-left: -140px; bottom: 7px; }
.frame.watch::before { content: ""; right: calc(-1 * var(--bezel) - 7px); top: 26%; width: 9px; height: 38px; border-radius: 4px; background: #2C2C2E; box-shadow: 0 62px 0 #2C2C2E; }
.devbar {
  position: fixed; z-index: 70; bottom: 14px; left: 50%; transform: translateX(-50%); display: none;
  background: var(--material); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  border-radius: 9px; padding: 2px; gap: 2px; box-shadow: 0 1px 4px rgba(0,0,0,.12), 0 0 0 .5px var(--sep);
}
@media (min-width: 900px) { .devbar { display: flex; } .stage:not(.preview) .inner { padding-bottom: 72px; } }
.devbar button { min-height: 28px; padding: 0 12px; border-radius: 7px; font-size: 13px; font-weight: 500; letter-spacing: -.08px; color: var(--label); }
.devbar button[aria-pressed="true"] { background: var(--seg-on); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }

/* ---------- Shell ---------- */
.app { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto; grid-template-columns: 1fr; background: var(--bg); --sat: 0px; --sab: 0px; }
.content { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative; display: flex; flex-direction: column; }
.inner { flex: 1; width: 100%; max-width: 680px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 32px; }
.sidebar, .inspector { display: none; }

/* ---------- Tab bar (49pt) ---------- */
.tabbar {
  display: grid; grid-template-columns: repeat(3, 1fr); min-height: calc(49px + var(--sab)); padding-bottom: var(--sab);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 -.5px 0 var(--sep); z-index: 5;
}
.tab { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 49px; color: var(--c-gray); font-size: 10px; line-height: 12px; font-weight: 500; letter-spacing: .12px; position: relative; }
.tab[aria-current="page"] { color: var(--c-blue); }
.tab .dot { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--c-red); color: #fff; font-size: 11px; line-height: 16px; font-weight: 600; text-align: center; }

/* ---------- Navigation bar ---------- */
.nav {
  position: sticky; top: 0; z-index: 4; min-height: calc(44px + var(--sat)); padding-top: var(--sat);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: transparent; transition: background .2s, box-shadow .2s;
}
.nav.scrolled { background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 .5px 0 var(--sep); }
.nav-title { font-weight: 600; font-size: 17px; opacity: 0; transition: opacity .2s; white-space: nowrap; }
.nav.scrolled .nav-title { opacity: 1; }
.nav-l { justify-self: start; display: flex; } .nav-r { justify-self: end; display: flex; }
.bar-btn { min-height: 44px; min-width: 44px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--c-blue); font-size: 17px; }
.bar-btn:active { opacity: .3; }
.bar-btn.bold { font-weight: 600; }
.bar-btn[disabled] { color: var(--label3); cursor: default; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 2px 4px 16px; }
.eyebrow { color: var(--label2); font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: -.08px; }
.large-title { font: 700 34px/41px var(--font-display); letter-spacing: .37px; text-wrap: balance; overflow-wrap: anywhere; }
.subline { color: var(--label2); font-size: 15px; line-height: 20px; letter-spacing: -.24px; margin-top: 2px; }
.wstat { display: none; }

/* Progress ring */
.ring { position: relative; width: 56px; height: 56px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
.ring .track { stroke: var(--ring-track); }
.ring .bar { stroke: var(--c-blue); transition: stroke-dashoffset .5s var(--ease); }
.ring.full .bar { stroke: var(--c-green); }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 600; letter-spacing: -.08px; font-variant-numeric: tabular-nums; }

/* ---------- Quick add ---------- */
.quick { display: flex; align-items: center; gap: 8px; min-height: 44px; background: var(--cell); border-radius: var(--r); padding: 0 10px 0 14px; margin: 0 0 18px; }
.quick svg { color: var(--c-blue); }
.quick input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; min-height: 44px; }
.quick input::placeholder { color: var(--label3); }
.quick .go { color: var(--c-blue); font-weight: 600; min-height: 44px; padding: 0 6px; }
.quick .go[disabled] { color: var(--label3); }

/* ---------- Sections ---------- */
.sec { margin: 0 0 22px; }
.sec-h { display: flex; align-items: baseline; gap: 8px; margin: 0 4px 8px; }
.sec-h h2 { font: 600 20px/25px var(--font-display); letter-spacing: .38px; }
.sec-h .swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--sc); align-self: center; }
.sec-h .n { color: var(--label2); font-size: 15px; letter-spacing: -.24px; font-variant-numeric: tabular-nums; }
.sec-h .late { color: var(--c-red); }
.sec-h .act { margin-left: auto; color: var(--c-blue); font-size: 15px; min-height: 32px; letter-spacing: -.24px; }
.sec-f { font-size: 13px; line-height: 18px; letter-spacing: -.08px; color: var(--label2); margin: 7px 16px 0; }
.tasks { list-style: none; margin: 0; padding: 0; background: var(--cell); border-radius: var(--r); overflow: hidden; }
.tasks:empty { display: none; }

/* ---------- Task rows ---------- */
.task { position: relative; overflow: hidden; }
.task .act-l, .task .act-r { position: absolute; top: 0; bottom: 0; display: flex; visibility: hidden; }
.task.open .act-l, .task.open .act-r { visibility: visible; }
.task .act-l { left: 0; } .task .act-r { right: 0; }
.task .act-l button, .task .act-r button { width: 84px; color: #fff; font-size: 13px; font-weight: 500; display: grid; place-items: center; align-content: center; gap: 4px; }
.task .a-move { background: var(--c-blue); } .task .a-del { background: var(--c-red); }
.task-c {
  position: relative; display: flex; align-items: flex-start; gap: 10px; padding-left: 14px; background: var(--cell);
  touch-action: pan-y; transition: transform .35s var(--ease); z-index: 1;
}
.task-c.dragging { transition: none; }
.task-c::after { content: ""; position: absolute; left: 50px; right: 0; bottom: 0; height: .5px; background: var(--sep); }
.task:last-child .task-c::after { display: none; }
.check-hit { padding: 0 2px; min-width: 28px; min-height: 44px; display: flex; align-items: flex-start; }
.check { margin-top: 10px; width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--label3); transition: box-shadow .2s; }
.check[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--sc, var(--c-blue)); }
.check[aria-checked="true"]::before { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--sc, var(--c-blue)); animation: pop .3s var(--ease); }
@keyframes pop { from { transform: scale(.2); } to { transform: none; } }
.task-b { flex: 1; min-width: 0; text-align: left; padding: 11px 16px 11px 0; display: flex; gap: 8px; align-items: flex-start; }
.task-b .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.task.done .t-title { color: var(--label2); text-decoration: line-through; text-decoration-color: var(--label3); }
.t-notes { color: var(--label2); font-size: 15px; line-height: 20px; letter-spacing: -.24px; margin-top: 1px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.t-meta { color: var(--label2); font-size: 13px; line-height: 18px; letter-spacing: -.08px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; }
.t-meta .late { color: var(--c-red); }
.chip { display: inline-flex; align-items: center; padding: 0 7px; height: 18px; border-radius: 9px; font-size: 11px; font-weight: 600; line-height: 18px; letter-spacing: 0; background: color-mix(in srgb, var(--sc) 16%, transparent); color: var(--sc); }
.composer input { width: 100%; border: 0; outline: 0; background: transparent; padding: 11px 16px 11px 0; font-size: 17px; }
.composer input::placeholder { color: var(--label3); }
.add-row { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; color: var(--c-blue); font-size: 17px; width: 100%; text-align: left; }
.add-row:active { background: var(--fill3); }
.add-row .plus { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--c-blue); box-shadow: inset 0 0 0 1.5px var(--c-blue); }

/* ---------- History ---------- */
.day-h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 8px; }
.day-h h2 { font: 600 17px/22px var(--font); letter-spacing: -.41px; }
.day-h .n { color: var(--label2); font-size: 15px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 22px; }
.stat { background: var(--cell); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font: 700 24px/29px var(--font-display); letter-spacing: .36px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--label2); font-size: 13px; line-height: 18px; letter-spacing: -.08px; }

/* ---------- Empty / banner ---------- */
.empty { text-align: center; color: var(--label2); padding: 56px 24px; display: grid; justify-items: center; gap: 8px; }
.empty b { color: var(--label); font: 600 20px/25px var(--font-display); letter-spacing: .38px; }
.empty span { font-size: 15px; line-height: 20px; max-width: 30ch; }
.banner { display: flex; gap: 10px; align-items: center; background: var(--cell); border-radius: var(--r); padding: 10px 12px 10px 14px; margin: 0 0 18px; font-size: 15px; line-height: 20px; letter-spacing: -.24px; color: var(--label2); }
.banner p { flex: 1; min-width: 0; }
.banner button { color: var(--c-blue); font-weight: 600; min-height: 36px; white-space: nowrap; }

/* ---------- Sheets / forms ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .25s; }
.scrim[hidden] { display: none !important; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; height: calc(100% - 10px - var(--sat)); background: var(--bg); border-radius: 10px 10px 0 0; display: flex; flex-direction: column; overflow: hidden; animation: rise .45s var(--ease); }
@keyframes rise { from { transform: translateY(100%); } }
@keyframes zoom { from { transform: translateY(24px); opacity: 0; } }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--fill); margin: 5px auto 0; flex: none; }
.sheet .nav, .inspector .nav { position: relative; padding-top: 0; }
.sheet .nav-title, .inspector .nav-title { opacity: 1; }
.sheet-body { flex: 1; overflow-y: auto; padding: 8px 16px calc(24px + var(--sab)); }
.group { margin: 0 0 22px; background: var(--cell); border-radius: var(--r); overflow: hidden; }
.field { width: 100%; border: 0; outline: 0; background: transparent; padding: 11px 16px; font-size: 17px; line-height: 22px; display: block; resize: none; }
.field::placeholder { color: var(--label3); }
.field-row { position: relative; }
.field-row::after { content: ""; position: absolute; left: 16px; right: 0; bottom: 0; height: .5px; background: var(--sep); }
.field-row:last-child::after { display: none; }
.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; }
.row .lbl { flex: 1; min-width: 0; }
input.date { border: 0; outline: 0; background: var(--fill3); border-radius: 8px; padding: 6px 10px; font-size: 17px; color: var(--c-blue); min-height: 34px; }
.seg-cell { padding: 10px 16px; display: grid; gap: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill3); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { min-height: 28px; border-radius: 7px; font-size: 13px; font-weight: 500; padding: 0 6px; letter-spacing: -.08px; }
.seg button[aria-pressed="true"] { background: var(--seg-on); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }
.destructive { width: 100%; min-height: 44px; color: var(--c-red); font-size: 17px; }

/* Context menu */
.cmenu { position: absolute; z-index: 25; width: 250px; background: var(--material); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); border-radius: 13px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.25); animation: zoom .25s var(--ease); }
.cmenu .title { padding: 10px 16px; font-size: 13px; line-height: 18px; color: var(--label2); border-bottom: .5px solid var(--sep); overflow-wrap: anywhere; }
.cmenu button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0 16px; font-size: 17px; text-align: left; border-bottom: .5px solid var(--sep); }
.cmenu button:last-child { border-bottom: 0; }
.cmenu button:active { background: var(--fill3); }
.cmenu button.red { color: var(--c-red); }

/* Action sheet */
.action-sheet { width: 100%; max-width: 420px; padding: 0 8px calc(8px + var(--sab)); display: grid; gap: 8px; animation: rise .4s var(--ease); }
.as-group { background: var(--material); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); border-radius: 14px; overflow: hidden; }
.as-msg { padding: 14px 16px; text-align: center; color: var(--label2); font-size: 13px; line-height: 18px; border-bottom: .5px solid var(--sep); }
.as-btn { width: 100%; min-height: 57px; font-size: 20px; color: var(--c-blue); }

const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

/* ---------- state ---------- */
let state = { tasks: [] };
let isExample = false;
let tab = 'today';
let composing = null;
const recentlyDone = new Set();
let idiom = 'phone', preview = 'auto';
const isWide = () => idiom === 'pad' || idiom === 'mac';

function exampleState() {
  let t = Date.now() - 1e6;
  const T = (title, o = {}) => ({ id: uid(), title, notes: '', date: null, slot: null, done: false, doneAt: null, created: t += 1000, ...o });
  const yd = dayOffset(-1);
  return { tasks: [
    T('관리비 자동이체 확인', { date: yd, slot: 'pm' }),
    T('세탁소에서 코트 찾기', { date: today(), slot: 'am', notes: '영수증 지갑에 있음' }),
    T('분기 리뷰 슬라이드 초안', { date: today(), slot: 'am', notes: '핵심 지표 3개, 10장 이내' }),
    T('디자인 QA 피드백 회신', { date: today(), slot: 'pm' }),
    T('운동 30분', { date: today(), slot: 'eve' }),
    T('치과 정기검진 예약', { date: dayOffset(1), slot: 'am' }),
    T('팀 회식 장소 예약', { date: dayOffset(3), slot: 'pm' }),
    T('여권 갱신 알아보기'), T('책장 정리'), T('친구 생일 선물 고르기'),
    T('주간 회의록 공유', { date: today(), slot: 'am', done: true, doneAt: Date.now() - 36e5 }),
    T('여권 사진 찍기', { date: yd, slot: 'pm', done: true, doneAt: Date.now() - 864e5 - 7200e3 }),
    T('은행 서류 제출', { date: yd, slot: 'am', done: true, doneAt: Date.now() - 864e5 - 18000e3 }),
    T('화분 물 주기', { date: dayOffset(-2), slot: 'eve', done: true, doneAt: Date.now() - 2 * 864e5 })
  ] };
}
function normalize(d) {
  const tasks = Array.isArray(d?.tasks) ? d.tasks.filter(t => t && t.id).map(t => {
    const date = t.date || t.due || null;
    return {
      id: String(t.id), title: String(t.title || ''), notes: String(t.notes || ''),
      date: /^\d{4}-\d{2}-\d{2}$/.test(date || '') ? date : null,
      slot: SLOT_ORDER.includes(t.slot) ? t.slot : null,
      done: !!t.done, doneAt: t.doneAt || null, created: t.created || 0
    };
  }) : [];
  return { tasks };
}

/* ---------- persistence ---------- */
const LS_KEY = 'daylist.v2';
const store = { mode: 'pending', ref: null, saving: false, again: false, timer: 0, dirty: false, readOnly: false, offline: false };
function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {} return null; }
function useLocal() {
  store.mode = 'local';
  const d = loadLocal();
  if (d) { state = d; isExample = false; } else { state = exampleState(); isExample = true; }
  render();
}
async function initStore() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return useLocal();
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) {}
  const id = user ? await user.id() : null;
  if (!db || !id) return useLocal();
  store.mode = 'db';
  store.ref = db.doc('data/users/' + id + '/daylist');
  let gotFinal = false;
  const slow = setTimeout(() => { if (!gotFinal) { store.offline = true; render(); } }, 10000);
  store.ref.onSnapshot(snap => {
    if (!snap.metadata.fromCache) { gotFinal = true; store.offline = false; clearTimeout(slow); }
    if (store.dirty || store.saving) return;
    if (snap.exists) { state = normalize(snap.data()); isExample = false; }
    else if (!snap.metadata.fromCache && !isExample && !state.tasks.length) { state = exampleState(); isExample = true; }
    render();
  }, err => {
    clearTimeout(slow);
    if (err.code === 'revoked' || err.code === 'not_granted') store.readOnly = true;
    store.offline = err.code === 'unavailable';
    render();
  });
}
function persist() {
  isExample = false;
  if (store.readOnly) return;
  store.dirty = true;
  clearTimeout(store.timer);
  store.timer = setTimeout(flush, 300);
}
async function flush() {
  if (store.saving) { store.again = true; return; }
  store.saving = true;
  const body = JSON.parse(JSON.stringify({ tasks: state.tasks, v: 2 }));
  try {
    if (store.mode === 'db') await store.ref.set(body);
    else { try { localStorage.setItem(LS_KEY, JSON.stringify(body)); } catch (e) {} }
  } catch (e) {
    if (e && e.code === 'invalid_argument') { store.readOnly = true; render(); }
    else if (e && e.code === 'quota_exceeded') toast('저장 공간이 가득 찼어요. 기록에서 오래된 항목을 지워 주세요.');
    else if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); store.again = true; }
  }
  store.saving = false;
  if (store.again) { store.again = false; flush(); } else store.dirty = false;
}
function storeNote() {
  if (store.readOnly) return '읽기 전용이에요. 변경 사항이 저장되지 않아요.';
  if (store.mode === 'db') return store.offline ? '서버에 연결할 수 없어요. 연결되면 다시 동기화돼요.' : '내 계정에 비공개로 저장돼요.';
  if (store.mode === 'local') return '이 브라우저에만 저장돼요.';
  return '불러오는 중…';
}

/* ---------- derived ---------- */
const byCreated = (a, b) => a.created - b.created;
const isToday = t => !t.done && t.date === today();
const isLate = t => !t.done && t.date && t.date < today();
const isInbox = t => !t.done && !t.date;
const isUpcoming = t => !t.done && t.date && t.date > today();
const visible = (t, pred) => pred(t) || (recentlyDone.has(t.id) && pred({ ...t, done: false }));
const counts = () => ({ today: state.tasks.filter(t => isToday(t) || isLate(t)).length, inbox: state.tasks.filter(isInbox).length, history: state.tasks.filter(t => t.done).length });

/* ---------- rendering ---------- */
const app = $('#app'), stage = $('#stage'), frame = $('#frame'), content = $('#content'), sidebar = $('#sidebar'), tabbar = $('#tabbar'), inspector = $('#inspector'), devbar = $('#devbar');
const TABS = [['today', '오늘', I.sun], ['inbox', '받은함', I.tray], ['history', '기록', I.clock]];

function render() {
  app.dataset.idiom = idiom;
  const c = counts();
  tabbar.innerHTML = TABS.map(([k, n, ic]) => `<button class="tab" data-tab="${k}" aria-current="${tab === k ? 'page' : 'false'}" aria-label="${n}${k === 'today' && c.today ? ', ' + c.today + '개 남음' : ''}">${ic}<span>${n}</span>${k === 'today' && c.today && idiom !== 'watch' ? `<span class="dot" aria-hidden="true">${c.today}</span>` : ''}</button>`).join('');
  sidebar.innerHTML = `<div class="sb-title">Daylist</div>` + TABS.map(([k, n, ic]) => `<button class="sb-item" data-tab="${k}" aria-current="${tab === k ? 'page' : 'false'}">${ic}<span>${n}</span><span class="n">${c[k] || ''}</span></button>`).join('') + `<p class="sb-foot">${esc(storeNote())}${idiom === 'mac' ? '<br>⌘N 새 할 일 · ⌘1·2·3 화면 이동' : ''}</p>`;
  if (tab === 'today') renderToday(); else if (tab === 'inbox') renderInbox(); else renderHistory();
  observeTitle();
  if (composing) { const inp = $('#compose'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
}
const exampleBanner = () => isExample ? `<div class="banner"><p>예시 할 일이 보이고 있어요. 하나라도 바꾸면 내 목록으로 저장돼요.</p><button data-act="clear-example">비우고 시작</button></div>` : '';

function taskRow(t, ctx) {
  const sc = SLOTS[t.slot]?.color || 'var(--any)';
  const meta = [];
  if (ctx === 'late') meta.push(`<span class="late">${daysLate(t.date)}일 지남 · ${esc(dayLabel(t.date))}</span>`);
  if (ctx === 'history') {
    if (t.slot) meta.push(`<span class="chip" style="--sc:${sc}">${SLOTS[t.slot].name}</span>`);
    if (t.doneAt) { const d = new Date(t.doneAt); meta.push(`<span>${d.getHours() < 12 ? '오전' : '오후'} ${d.getHours() % 12 || 12}:${pad(d.getMinutes())} 완료</span>`); }
  }
  const moveLabel = ctx === 'today' ? '내일로' : '오늘로';
  const moveIcon = ctx === 'today' ? I.arrowR : I.arrowDown;
  return `<li class="task${t.done ? ' done' : ''}" data-id="${esc(t.id)}" data-ctx="${ctx}" style="--sc:${sc}">
    ${ctx === 'history' ? '' : `<div class="act-l" aria-hidden="true"><button class="a-move" tabindex="-1" data-act="move">${moveIcon}<span>${moveLabel}</span></button></div>`}
    <div class="act-r" aria-hidden="true"><button class="a-del" tabindex="-1" data-act="del">${I.trash}<span>삭제</span></button></div>
    <div class="task-c">
      <button class="check-hit" data-act="toggle" aria-label="${esc(t.title)} ${t.done ? '완료 취소' : '완료'}"><span class="check" role="checkbox" aria-checked="${t.done}"></span></button>
      <button class="task-b" data-act="open" aria-label="${esc(t.title)} 세부사항">
        <span class="txt">
          <span class="t-title">${esc(t.title) || '<span style="color:var(--label3)">제목 없음</span>'}</span>
          ${t.notes ? `<span class="t-notes">${esc(t.notes)}</span>` : ''}
          ${meta.length ? `<span class="t-meta">${meta.join('<span aria-hidden="true">·</span>')}</span>` : ''}
        </span>
      </button>
    </div></li>`;
}
function composerRow(key, sc) {
  if (!composing || composing.key !== key) return '';
  return `<li class="task composer" style="--sc:${sc}"><div class="task-c"><span class="check-hit"><span class="check"></span></span>
    <input id="compose" type="text" enterkeyhint="done" autocomplete="off" placeholder="할 일" value="${esc(composing.text)}" aria-label="새로운 할 일"></div></li>`;
}
const addRow = key => `<button class="add-row" data-act="compose" data-key="${key}"><span class="plus">${I.plus}</span><span>추가</span></button>`;
function navHtml(title, right = '') {
  return `<div class="nav" id="nav"><div class="nav-l"></div><div class="nav-title">${esc(title)}</div><div class="nav-r">${right}</div></div>
    <div class="wstat"><span style="color:var(--c-${tab === 'today' ? 'orange' : tab === 'inbox' ? 'blue' : 'green'})">${esc(title)}</span><time id="wclock">${clock()}</time></div>`;
}
const newBtn = () => `<button class="bar-btn" data-act="new-task" aria-label="새로운 할 일" title="새로운 할 일 (⌘N)">${I.plusBig}</button>`;

function renderToday() {
  const d = new Date();
  const late = state.tasks.filter(isLate).sort((a, b) => a.date.localeCompare(b.date) || byCreated(a, b));
  const todays = state.tasks.filter(t => t.date === today());
  const open = todays.filter(t => !t.done).length, total = todays.length;
  const pct = total ? Math.round((total - open) / total * 100) : 0;
  const r = 24, circ = 2 * Math.PI * r;
  let html = `<div class="head"><div><div class="eyebrow">${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}</div><h1 class="large-title" id="mainTitle" tabindex="-1">오늘</h1>
    <p class="subline">${total ? (open ? `${open}개 남음 · ${total - open}개 완료` : `오늘 할 일 ${total}개를 모두 마쳤어요`) : '오늘 할 일이 없어요'}</p></div>
    <div class="ring${total && !open ? ' full' : ''}" role="img" aria-label="오늘 진행률 ${pct}%"><svg viewBox="0 0 56 56"><circle class="track" cx="28" cy="28" r="${r}"/><circle class="bar" cx="28" cy="28" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - pct / 100)}"/></svg><span class="pct">${pct}%</span></div></div>`;
  html += exampleBanner();
  if (late.length) {
    html += `<section class="sec"><div class="sec-h"><h2 class="late">지난 항목</h2><span class="n">${late.length}</span><button class="act" data-act="late-today">모두 오늘로</button></div>
      <ul class="tasks">${late.map(t => taskRow(t, 'late')).join('')}</ul></section>`;
  }
  SLOT_ORDER.forEach(k => {
    const s = SLOTS[k];
    const items = todays.filter(t => (t.slot || 'any') === k && visible(t, x => !x.done)).sort(byCreated);
    const key = 'today:' + k;
    if (k === 'any' && !items.length && !(composing && composing.key === key)) return;
    html += `<section class="sec" style="--sc:${s.color}"><div class="sec-h"><span class="swatch"></span><h2>${s.name}</h2><span class="n">${items.length ? items.length : s.hint}</span></div>
      <ul class="tasks">${items.map(t => taskRow(t, 'today')).join('')}${composerRow(key, s.color)}${addRow(key)}</ul></section>`;
  });
  const upcoming = state.tasks.filter(isUpcoming).length;
  const doneToday = todays.filter(t => t.done && !recentlyDone.has(t.id)).length;
  html += `<p class="sec-f" style="margin-left:4px">${[upcoming ? `예정된 할 일 ${upcoming}개는 날짜가 되면 여기에 나타나요.` : '', doneToday ? `오늘 완료한 ${doneToday}개는 기록에서 볼 수 있어요.` : ''].filter(Boolean).join(' ') || '시간 미정 할 일은 틈날 때 처리하면 돼요.'}</p>`;
  content.innerHTML = navHtml('오늘', newBtn()) + `<div class="inner">${html}</div>`;
}

function renderInbox() {
  const items = state.tasks.filter(t => visible(t, isInbox)).sort((a, b) => b.created - a.created);
  const upcoming = state.tasks.filter(isUpcoming).sort((a, b) => a.date.localeCompare(b.date) || byCreated(a, b));
  let html = `<div class="head"><div><div class="eyebrow">날짜 없이 담아두기</div><h1 class="large-title" id="mainTitle" tabindex="-1">받은함</h1>
    <p class="subline">${items.length ? `${items.length}개 · 오른쪽으로 밀면 오늘로 옮겨요` : '떠오른 일을 먼저 적어두세요'}</p></div></div>`;
  html += `<form class="quick" id="quickForm">${I.pencil}<input id="quick" type="text" placeholder="떠오른 일 적기" autocomplete="off" enterkeyhint="done" aria-label="받은함에 추가"><button class="go" type="submit" id="quickGo" disabled>추가</button></form>`;
  html += exampleBanner();
  if (items.length) html += `<section class="sec"><ul class="tasks">${items.map(t => taskRow(t, 'inbox')).join('')}</ul></section>`;
  else html += `<div class="empty"><b>받은함이 비었어요</b><span>날짜를 정하지 않은 일은 여기에 모여요. 위에 적으면 바로 담겨요.</span></div>`;
  if (upcoming.length) {
    const byDay = [...new Set(upcoming.map(t => t.date))];
    html += `<section class="sec"><div class="sec-h"><h2>예정</h2><span class="n">${upcoming.length}</span></div>` +
      byDay.map(d => `<div class="day-h" style="margin-top:10px"><h2>${esc(dayLabel(d, true))}</h2></div><ul class="tasks">${upcoming.filter(t => t.date === d).map(t => taskRow(t, 'today')).join('')}</ul>`).join('') + `</section>`;
  }
  content.innerHTML = navHtml('받은함', newBtn()) + `<div class="inner">${html}</div>`;
}

function renderHistory() {
  const done = state.tasks.filter(t => t.done && !recentlyDone.has(t.id)).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const days = [...new Set(done.map(t => ymd(new Date(t.doneAt || 0))))];
  const week = done.filter(t => t.doneAt && Date.now() - t.doneAt < 7 * 864e5).length;
  let streak = 0;
  for (let i = 0; ; i++) { if (days.includes(dayOffset(-i))) streak++; else if (i > 0 || !days.includes(dayOffset(0))) break; }
  let html = `<div class="head"><div><div class="eyebrow">완료한 일</div><h1 class="large-title" id="mainTitle" tabindex="-1">기록</h1>
    <p class="subline">${done.length ? `지금까지 ${done.length}개를 마쳤어요` : '완료한 일이 여기에 쌓여요'}</p></div></div>`;
  if (done.length) {
    html += `<div class="stats"><div class="stat"><b>${done.filter(t => ymd(new Date(t.doneAt || 0)) === today()).length}</b><span>오늘</span></div><div class="stat"><b>${week}</b><span>최근 7일</span></div><div class="stat"><b>${streak}</b><span>연속 일수</span></div></div>`;
    days.forEach(d => {
      const items = done.filter(t => ymd(new Date(t.doneAt || 0)) === d);
      html += `<section class="sec"><div class="day-h"><h2>${esc(dayLabel(d, true))}</h2><span class="n">${items.length}개</span></div><ul class="tasks">${items.map(t => taskRow(t, 'history')).join('')}</ul></section>`;
    });
    html += `<button class="add-row" style="color:var(--c-red);justify-content:center" data-act="clear-done">기록 모두 지우기</button>`;
  } else {
    html += `<div class="empty"><b>아직 기록이 없어요</b><span>오늘에서 할 일을 완료하면 날짜별로 여기에 남아요.</span></div>`;
  }
  content.innerHTML = navHtml('기록') + `<div class="inner">${html}</div>`;
}

let io;
function observeTitle() {
  io && io.disconnect();
  const t = $('#mainTitle'), nav = $('#nav');
  if (!t || !nav || !('IntersectionObserver' in window) || idiom === 'watch' || idiom === 'mac') return;
  io = new IntersectionObserver(([e]) => nav.classList.toggle('scrolled', !e.isIntersecting), { root: content, rootMargin: '-44px 0px 0px 0px', threshold: 0 });
  io.observe(t);
}
setInterval(() => { const w = $('#wclock'); if (w) w.textContent = clock(); }, 15000);

/* ---------- mutations ---------- */
const find = id => state.tasks.find(t => t.id === id);
function addTask(title, o = {}) {
  const t = { id: uid(), title: title.trim(), notes: '', date: null, slot: null, done: false, doneAt: null, created: Date.now(), ...o };
  state.tasks.push(t); persist(); return t;
}
function toggleTask(id) {
  const t = find(id); if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
  if (t.done) { recentlyDone.add(id); setTimeout(() => { recentlyDone.delete(id); render(); }, 900); }
  persist(); render();
}
function moveTask(id, date, slot) {
  const t = find(id); if (!t) return;
  const prev = { date: t.date, slot: t.slot };
  t.date = date; if (slot !== undefined) t.slot = slot;
  persist(); render();
  lastUndo = () => { Object.assign(t, prev); persist(); render(); };
  toast(date === today() ? '오늘로 옮겼어요' : date === dayOffset(1) ? '내일로 미뤘어요' : date ? dayLabel(date) + '(으)로 옮겼어요' : '받은함으로 보냈어요', true);
}
let lastUndo = null, toastTimer = 0;
const truncate = (s, n) => s.length > n ? s.slice(0, n) + '…' : s;
function deleteTask(id) {
  const i = state.tasks.findIndex(x => x.id === id); if (i < 0) return;
  const t = state.tasks[i];
  if (inspector.dataset.id === id) closeInspector();
  state.tasks.splice(i, 1); persist(); render();
  lastUndo = () => { state.tasks.splice(Math.min(i, state.tasks.length), 0, t); persist(); render(); };
  toast(`‘${truncate(t.title || '제목 없음', idiom === 'watch' ? 8 : 16)}’ 삭제됨`, true);
}
function toast(msg, undo) {
  $('#toastMsg').textContent = msg;
  $('#toastUndo').hidden = !undo;
  $('#toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('#toast').hidden = true; lastUndo = null; }, 5000);
}
$('#toastUndo').addEventListener('click', () => { const u = lastUndo; lastUndo = null; $('#toast').hidden = true; u && u(); });

/* ---------- sheets ---------- */
const scrim = $('#scrim');
let sheetReturn = null;
function openSheet(html, cls = '') {
  sheetReturn = document.activeElement;
  scrim.className = 'scrim ' + cls;
  scrim.innerHTML = html; scrim.hidden = false;
  let f = scrim.querySelector('[autofocus]');
  if (!f) { f = scrim.firstElementChild; f && f.setAttribute('tabindex', '-1'); }
  f && setTimeout(() => f.focus({ preventScroll: true }), 30);
}
function closeSheet() {
  if (scrim.hidden) return;
  scrim.hidden = true; scrim.innerHTML = '';
  sheetReturn && sheetReturn.isConnected && sheetReturn.focus();
}
function closeInspector() { app.classList.remove('has-inspector'); inspector.innerHTML = ''; delete inspector.dataset.id; }
scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(); });
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && !e.shiftKey && !e.altKey && isWide()) {
    if (e.key === 'n') { e.preventDefault(); openEditor(null); return; }
    const n = { '1': 'today', '2': 'inbox', '3': 'history' }[e.key];
    if (n) { e.preventDefault(); switchTab(n); return; }
  }
  if (!scrim.hidden) {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
    if (e.key === 'Enter' && mod) { const d = scrim.querySelector('[data-sheet="done"]'); d && !d.disabled && d.click(); }
  } else if (app.classList.contains('has-inspector')) {
    if (e.key === 'Escape') { e.preventDefault(); closeInspector(); }
    if (e.key === 'Enter' && mod) { const d = inspector.querySelector('[data-sheet="done"]'); d && !d.disabled && d.click(); }
  }
});

function confirmSheet(msg, label, onYes) {
  openSheet(`<div class="action-sheet" role="dialog" aria-modal="true" aria-label="확인">
    <div class="as-group"><div class="as-msg">${esc(msg)}</div><button class="as-btn red" data-sheet="yes">${esc(label)}</button></div>
    <button class="as-btn cancel" data-sheet="cancel" autofocus>취소</button></div>`, 'as');
  scrim.querySelector('[data-sheet="yes"]').onclick = () => { closeSheet(); onYes(); };
  scrim.querySelector('[data-sheet="cancel"]').onclick = closeSheet;
}

function menuItems(t) {
  const items = [];
  if (!t.done) {
    if (t.date !== today()) items.push(['today', '오늘로', I.sun]);
    if (t.date !== dayOffset(1)) items.push(['tomorrow', '내일로', I.arrowR]);
    if (t.date) items.push(['inbox', '받은함으로', I.tray]);
    items.push(['done', '완료', I.checkmark]);
  } else items.push(['undone', '완료 취소', I.undo]);
  items.push(['edit', '세부사항', I.pencil], ['del', '삭제', I.trash, 'red']);
  return items;
}
function runMenu(id, k) {
  const t = find(id); if (!t) return;
  switch (k) {
    case 'today': moveTask(id, today(), t.slot || slotNow()); break;
    case 'tomorrow': moveTask(id, dayOffset(1)); break;
    case 'inbox': moveTask(id, null, null); break;
    case 'done': case 'undone': toggleTask(id); break;
    case 'edit': openEditor(t); break;
    case 'del': deleteTask(id); break;
  }
}
function contextMenu(id, cx, cy) {
  const t = find(id); if (!t) return;
  openSheet(`<div class="cmenu" role="menu" aria-label="${esc(t.title)}"><div class="title">${esc(t.title)}</div>${menuItems(t).map(([k, n, ic, c]) => `<button role="menuitem" data-m="${k}" class="${c || ''}"><span>${n}</span>${ic}</button>`).join('')}</div>`, 'cm');
  const m = scrim.querySelector('.cmenu');
  const r = app.getBoundingClientRect(), s = r.width / app.offsetWidth || 1;
  const x = (cx - r.left) / s, y = (cy - r.top) / s, W = app.offsetWidth, H = app.offsetHeight, mw = m.offsetWidth, mh = m.offsetHeight;
  if (idiom === 'watch') { /* CSS pins it to the bottom */ }
  else if (idiom === 'mac') { m.style.left = Math.max(8, Math.min(W - mw - 8, x)) + 'px'; m.style.top = Math.max(8, Math.min(H - mh - 8, y)) + 'px'; }
  else if (W > 500) { m.style.left = Math.max(12, Math.min(W - mw - 12, x - mw / 2)) + 'px'; m.style.top = Math.max(12, Math.min(H - mh - 12, y + 8)) + 'px'; }
  else { m.style.left = '12px'; m.style.right = '12px'; m.style.width = 'auto'; m.style.bottom = 'calc(16px + var(--sab))'; }
  m.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; closeSheet(); runMenu(id, b.dataset.m); });
}

/* Editor: sheet on watch/phone/pad, inspector on mac */
function openEditor(task, preset = {}) {
  if (idiom === 'watch') return watchEditor(task);
  const isNew = !task;
  const draft = task ? { ...task } : { title: '', notes: '', date: null, slot: null, ...(tab === 'today' ? { date: today(), slot: slotNow() } : {}), ...preset };
  const when = draft.date === today() ? 'today' : draft.date === dayOffset(1) ? 'tomorrow' : draft.date ? 'pick' : 'none';
  const body = `
    <div class="nav"><div class="nav-l"><button class="bar-btn" data-sheet="cancel">${idiom === 'mac' ? I.x : '취소'}</button></div>
      <div class="nav-title" id="sheetT">${isNew ? '새로운 할 일' : '세부사항'}</div>
      <div class="nav-r"><button class="bar-btn bold" data-sheet="done"${draft.title.trim() ? '' : ' disabled'}>${isNew ? '추가' : '완료'}</button></div></div>
    <div class="sheet-body">
      <div class="group">
        <div class="field-row"><input class="field" id="f-title" placeholder="제목" value="${esc(draft.title)}" autocomplete="off" ${isNew ? 'autofocus' : ''} aria-label="제목"></div>
        <div class="field-row"><textarea class="field" id="f-notes" rows="2" placeholder="메모" aria-label="메모">${esc(draft.notes)}</textarea></div>
      </div>
      <div class="group">
        <div class="seg-cell"><span>언제</span><div class="seg" role="group" aria-label="날짜" id="f-when">
          ${[['none', '받은함'], ['today', '오늘'], ['tomorrow', '내일'], ['pick', '날짜']].map(([k, n]) => `<button type="button" data-w="${k}" aria-pressed="${when === k}">${n}</button>`).join('')}</div></div>
        <div class="row" id="f-daterow" style="border-top:.5px solid var(--sep)"${when === 'pick' ? '' : ' hidden'}><span class="lbl" style="color:var(--label2)">날짜</span><input type="date" class="date" id="f-date" value="${esc(draft.date || today())}" aria-label="날짜"></div>
      </div>
      <div class="group" id="f-slotgroup"${when === 'none' ? ' hidden' : ''}>
        <div class="seg-cell"><span>시간대</span><div class="seg" role="group" aria-label="시간대" id="f-slot">
          ${SLOT_ORDER.map(k => `<button type="button" data-s="${k}" aria-pressed="${(draft.slot || 'any') === k}">${SLOTS[k].name}</button>`).join('')}</div></div>
      </div>
      ${isNew ? '' : `<div class="group"><button class="destructive" data-sheet="delete">할 일 삭제</button></div>
      <p class="sec-f" style="margin-top:-12px">${esc(task.done ? '완료: ' + dayLabel(ymd(new Date(task.doneAt || 0)), true) : '추가: ' + dayLabel(ymd(new Date(task.created || 0)), true))}</p>`}
    </div>`;
  let root, close;
  if (idiom === 'mac') {
    closeSheet();
    inspector.innerHTML = body; inspector.dataset.id = task ? task.id : '';
    app.classList.add('has-inspector'); root = inspector; close = closeInspector;
    const f = inspector.querySelector('#f-title'); f && setTimeout(() => f.focus(), 30);
  } else {
    openSheet(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT"><div class="grabber"></div>${body}</div>`);
    root = scrim; close = closeSheet;
  }
  const $s = s => root.querySelector(s);
  const title = $s('#f-title'), done = $s('[data-sheet="done"]'), notes = $s('#f-notes');
  const grow = () => { notes.style.height = 'auto'; notes.style.height = Math.max(idiom === 'mac' ? 32 : 44, notes.scrollHeight) + 'px'; };
  grow(); notes.addEventListener('input', grow);
  title.addEventListener('input', () => { done.disabled = !title.value.trim(); });
  title.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); if (title.value.trim()) done.click(); } });
  const pressed = (sel, attr) => $s(`${sel} [aria-pressed="true"]`)?.getAttribute(attr);
  const sync = () => { const w = pressed('#f-when', 'data-w'); $s('#f-daterow').hidden = w !== 'pick'; $s('#f-slotgroup').hidden = w === 'none'; };
  const seg = (sel, attr) => { $s(sel).addEventListener('click', e => { const b = e.target.closest(`[${attr}]`); if (!b) return; $s(sel).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); sync(); }); };
  seg('#f-when', 'data-w'); seg('#f-slot', 'data-s');
  $s('[data-sheet="cancel"]').onclick = close;
  done.onclick = () => {
    const w = pressed('#f-when', 'data-w');
    const date = w === 'today' ? today() : w === 'tomorrow' ? dayOffset(1) : w === 'pick' ? ($s('#f-date').value || today()) : null;
    const s = pressed('#f-slot', 'data-s');
    const v = { title: title.value.trim(), notes: notes.value.trim(), date, slot: date ? (s === 'any' ? null : s) : null };
    if (!v.title) return;
    if (isNew) addTask(v.title, v); else { Object.assign(find(task.id) || {}, v); persist(); }
    close(); render();
  };
  const del = $s('[data-sheet="delete"]');
  if (del) del.onclick = () => { close(); confirmSheet('이 할 일을 삭제할까요?', '할 일 삭제', () => deleteTask(task.id)); };
}
function watchEditor(task) {
  if (!task) return;
  openSheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(task.title)}">
    <div class="nav"><div class="nav-l"><button class="bar-btn" data-sheet="cancel" aria-label="닫기">${I.x}</button></div><div class="nav-title">${task.done ? '완료됨' : task.date ? esc(dayLabel(task.date)) : '받은함'}</div><div class="nav-r"></div></div>
    <div class="sheet-body"><div class="wtitle">${esc(task.title)}</div><div style="display:grid;gap:4px">
      ${menuItems(task).filter(([k]) => k !== 'edit').map(([k, n, ic, c]) => `<button class="wbtn ${c === 'red' ? 'red' : k === 'done' ? 'tint' : ''}" data-m="${k}">${ic}<span>${n}</span></button>`).join('')}
    </div></div></div>`);
  scrim.querySelector('[data-sheet="cancel"]').onclick = closeSheet;
  scrim.querySelector('.sheet-body').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; closeSheet(); runMenu(task.id, b.dataset.m); });
}

/* ---------- events ---------- */
function switchTab(k) {
  if (tab === k) { content.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  tab = k; composing = null; closeSwipe(); render(); content.scrollTop = 0;
}
let suppressClick = false;
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  if (!scrim.hidden && scrim.contains(e.target)) return;
  const dv = e.target.closest('[data-dev]');
  if (dv) { setPreview(dv.dataset.dev); return; }
  const tb = e.target.closest('[data-tab]');
  if (tb) { switchTab(tb.dataset.tab); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const row = a.closest('.task'), id = row?.dataset.id, ctx = row?.dataset.ctx;
  switch (a.dataset.act) {
    case 'toggle': if (id) toggleTask(id); break;
    case 'open': if (id) { closeSwipe(); openEditor(find(id)); } break;
    case 'move': if (id) { closeSwipe(); ctx === 'today' ? moveTask(id, dayOffset(1)) : moveTask(id, today(), find(id)?.slot || slotNow()); } break;
    case 'del': if (id) deleteTask(id); break;
    case 'new-task': openEditor(null); break;
    case 'compose': composing = { key: a.dataset.key, text: '' }; render(); break;
    case 'late-today': state.tasks.filter(isLate).forEach(t => { t.date = today(); }); persist(); render(); toast('지난 항목을 오늘로 옮겼어요'); break;
    case 'clear-example': state = { tasks: [] }; persist(); render(); break;
    case 'clear-done': {
      const done = state.tasks.filter(t => t.done);
      confirmSheet(`완료한 할 일 ${done.length}개의 기록을 지울까요?`, '기록 지우기', () => {
        state.tasks = state.tasks.filter(t => !t.done); persist(); render();
        lastUndo = () => { state.tasks.push(...done); persist(); render(); };
        toast(`기록 ${done.length}개 지움`, true);
      });
      break;
    }
  }
}, true);

document.addEventListener('submit', e => {
  if (e.target.id !== 'quickForm') return;
  e.preventDefault();
  const q = $('#quick'), v = q.value.trim(); if (!v) return;
  addTask(v); render(); const nq = $('#quick'); if (nq) nq.focus();
});
document.addEventListener('input', e => {
  if (e.target.id === 'quick') { const g = $('#quickGo'); if (g) g.disabled = !e.target.value.trim(); }
  if (e.target.id === 'compose' && composing) composing.text = e.target.value;
});
let committing = false;
function commitCompose(keep) {
  const [, where, slot] = (composing?.key || '').match(/^(today):(\w+)$/) || [];
  const v = composing?.text.trim();
  if (v) addTask(v, where === 'today' ? { date: today(), slot: slot === 'any' ? null : slot } : {});
  composing = keep && v ? { key: composing.key, text: '' } : null;
  render();
}
document.addEventListener('keydown', e => {
  if (e.target.id !== 'compose' || e.isComposing) return;
  if (e.key === 'Enter') { e.preventDefault(); committing = true; commitCompose(true); committing = false; }
  if (e.key === 'Escape') { e.stopPropagation(); composing = null; render(); }
});
document.addEventListener('focusout', e => {
  if (e.target.id !== 'compose' || committing || !composing) return;
  setTimeout(() => { if (composing && document.activeElement?.id !== 'compose') commitCompose(false); }, 0);
});
document.addEventListener('contextmenu', e => {
  const row = e.target.closest('.task:not(.composer)'); if (!row) return;
  e.preventDefault(); closeSwipe(); contextMenu(row.dataset.id, e.clientX, e.clientY);
});

/* ---------- swipe + long press ---------- */
let sw = null, openRow = null, pressTimer = 0;
const openW = () => idiom === 'watch' ? 60 : idiom === 'mac' ? 68 : 84;
function setX(c, x) {
  const li = c.parentElement;
  c.style.transform = x ? `translateX(${x}px)` : '';
  if (x) li.classList.add('open');
  else setTimeout(() => { if (!c.style.transform) li.classList.remove('open'); }, 380);
}
function closeSwipe(except) { if (openRow && openRow !== except) { setX(openRow.c, 0); openRow = null; } }
document.addEventListener('pointerdown', e => {
  clearTimeout(pressTimer);
  const c = e.target.closest('.task:not(.composer) .task-c');
  if (!c || e.button !== 0) { if (!e.target.closest('.act-l, .act-r')) closeSwipe(); return; }
  if (openRow && openRow.c !== c) closeSwipe();
  const hasMove = !!c.parentElement.querySelector('.act-l');
  const scale = app.getBoundingClientRect().width / app.offsetWidth || 1;
  sw = { c, x: e.clientX, y: e.clientY, base: openRow?.c === c ? openRow.x : 0, cur: 0, active: false, id: e.pointerId, hasMove, scale };
  if (e.pointerType !== 'mouse') pressTimer = setTimeout(() => {
    if (!sw || sw.active) return;
    const id = c.closest('.task').dataset.id; sw = null; suppressClick = true; setTimeout(() => { suppressClick = false; }, 400);
    contextMenu(id, e.clientX, e.clientY);
  }, 480);
});
document.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.id) return;
  const dx = (e.clientX - sw.x) / sw.scale, dy = (e.clientY - sw.y) / sw.scale;
  if (!sw.active) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) { clearTimeout(pressTimer); sw.active = true; sw.c.classList.add('dragging'); try { sw.c.setPointerCapture(e.pointerId); } catch (_) {} }
    else if (Math.abs(dy) > 10) { clearTimeout(pressTimer); sw = null; return; }
    else return;
  }
  let x = sw.base + dx;
  if (x > 0 && !sw.hasMove) x = 0;
  sw.cur = x; setX(sw.c, x);
});
const endSwipe = e => {
  clearTimeout(pressTimer);
  if (!sw || e.pointerId !== sw.id) return;
  const { c, cur, active } = sw; sw = null;
  if (!active) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  c.classList.remove('dragging');
  const w = c.offsetWidth, ow = openW(), row = c.closest('.task'), id = row.dataset.id, ctx = row.dataset.ctx;
  if (cur < -w * 0.55) { setX(c, -w); openRow = null; setTimeout(() => deleteTask(id), 180); }
  else if (cur > w * 0.55) { setX(c, w); openRow = null; setTimeout(() => ctx === 'today' ? moveTask(id, dayOffset(1)) : moveTask(id, today(), find(id)?.slot || slotNow()), 180); }
  else if (cur < -ow / 2) { setX(c, -ow); openRow = { c, x: -ow }; }
  else if (cur > ow / 2) { setX(c, ow); openRow = { c, x: ow }; }
  else { setX(c, 0); if (openRow?.c === c) openRow = null; }
};
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

/* ---------- idiom + device preview ---------- */
const DEV = {
  watch: { w: 198, h: 242, r: 44, bezel: 14, sat: 0, sab: 0, name: '워치' },
  phone: { w: 393, h: 852, r: 55, bezel: 12, sat: 54, sab: 34, name: '폰' },
  pad: { w: 1024, h: 768, r: 22, bezel: 18, sat: 24, sab: 20, name: '패드' },
  mac: { w: 1120, h: 720, r: 11, bezel: 0, sat: 0, sab: 0, name: '맥' }
};
const finePointer = matchMedia('(hover: hover) and (pointer: fine)');
const detectIdiom = w => preview !== 'auto' ? preview : w <= 260 ? 'watch' : w < 768 ? 'phone' : (finePointer.matches && w >= 1000) ? 'mac' : 'pad';
function renderDevbar() {
  devbar.innerHTML = [['auto', '자동'], ...Object.entries(DEV).map(([k, d]) => [k, d.name])].map(([k, n]) => `<button data-dev="${k}" aria-pressed="${preview === k}">${n}</button>`).join('');
}
function setPreview(p) {
  preview = p in DEV ? p : 'auto';
  try { localStorage.setItem('daylist.preview', preview); } catch (e) {}
  renderDevbar(); layout();
}
function layout() {
  const on = preview !== 'auto';
  stage.classList.toggle('preview', on);
  frame.className = 'frame' + (on ? ' ' + preview : '');
  app.classList.toggle('framed', on);
  if (on) {
    const d = DEV[preview];
    const s = Math.min(1, (innerWidth - 56) / (d.w + 2 * d.bezel), (innerHeight - 100) / (d.h + 2 * d.bezel));
    frame.style.cssText = `--fw:${d.w}px;--fh:${d.h}px;--fr:${d.r}px;--bezel:${d.bezel}px;--fs:${s.toFixed(3)}`;
    app.style.cssText = `--sat:${d.sat}px;--sab:${d.sab}px`;
  } else { frame.style.cssText = ''; app.style.cssText = ''; }
  const next = detectIdiom(on ? DEV[preview].w : app.clientWidth);
  if (next !== idiom) { idiom = next; closeSheet(); closeInspector(); composing = null; render(); }
}
try { const p = localStorage.getItem('daylist.preview'); if (p && p in DEV && innerWidth >= 900) preview = p; } catch (e) {}
addEventListener('resize', layout);
finePointer.addEventListener ? finePointer.addEventListener('change', layout) : finePointer.addListener(layout);

/* ---------- boot ---------- */
{ const h = location.hash.slice(1); if (['today', 'inbox', 'history'].includes(h)) tab = h; }
renderDevbar();
idiom = detectIdiom(preview !== 'auto' ? DEV[preview].w : app.clientWidth);
layout();
render();
setTimeout(initStore, 0);
})();
</script>
